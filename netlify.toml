# Netlify 배포 설정 — GitHub 저장소를 연결하면 이 파일을 자동으로 읽습니다.
[build]
  publish = "public"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"
  command = "echo '정적 파일과 함수만 배포합니다(별도 빌드 없음)'"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# 검색엔진 노출 방지(로그인 없는 공개 수정 사이트이므로 주소를 아는 사람만 접근하도록)
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
